; libroger's settings for lemmings2 (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; DispScreen's logos: Krisalis' (its credit line reaches row 215),
; Psygnosis' and DMA Design's (on a backdrop filling the screen)
rows = 0-215
; !RunImage, from its start (&8000 branches to &6D5C8): the title, map,
; practice and briefing screens use rows 0-199, a level 0-207 (the play
; area and the skill panel; below it, the border on the machine)
6D5C8 = 0-207
